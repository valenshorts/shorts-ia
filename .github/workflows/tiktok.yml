name: TikTok

# A las 13:07 y 21:07 AR (10:07 y 18:07 México) manda a TikTok, en calidad original, UN video: el más viejo que ya es
# público en YouTube y todavía no está en TikTok (desde el 004). Al día, el video nuevo sale a las 21:07.
# Mientras la app de TikTok no esté auditada, llega como BORRADOR: notificación en la app → Publicar.
# A mano: Run workflow. "code" = código de autorización de TikTok (solo para conectar la cuenta).
on:
  schedule:
    - cron: "7 16 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      code:
        description: "Código de autorización de TikTok (solo para conectar la cuenta)"
        required: false
        default: ""
      videos:
        description: "Números de idea separados por coma (ej: 014). Vacío = el próximo de la cola."
        required: false
        default: ""

permissions:
  actions: read
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conectar la cuenta
        if: github.event.inputs.code != ''
        run: python crosspost.py --tiktok-code "${{ github.event.inputs.code }}"

      - name: ¿Hay algo para subir?
        id: cola
        if: github.event.inputs.code == ''
        env:
          VIDEOS: ${{ github.event.inputs.videos }}
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          done = json.loads(Path("done.json").read_text(encoding="utf-8"))
          tt = json.loads(Path("tt_done.json").read_text(encoding="utf-8")) if Path("tt_done.json").exists() else {}
          pend = sorted(k for k, v in done.items()
                        if k >= "004" and k not in tt and v.get("publish_at", "") <= now)
          manual = os.environ.get("VIDEOS", "").strip()
          print(f"[tt] Pendientes: {pend or 'ninguno'}")
          ok = Path("tt_token.enc").exists() and os.environ.get("TIKTOK_CLIENT_KEY")
          if not ok:
              print("[tt] TikTok todavía no está conectado")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"hay={'1' if (ok and (pend or manual)) else ''}\n")
          PY

      - name: Bajar los videos
        if: steps.cola.outputs.hay == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          for r in $(gh run list -R "${{ github.repository }}" -w diario.yml --limit 60 --json databaseId -q '.[].databaseId'); do
            gh run download "$r" -R "${{ github.repository }}" -n short -D "dl/$r" 2>/dev/null || true
          done

      - name: Subir a TikTok
        if: steps.cola.outputs.hay == '1'
        env:
          VIDEOS: ${{ github.event.inputs.videos }}
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess, time
          from pathlib import Path
          found = {}
          for f in Path("dl").rglob("short_*.mp4"):
              found[re.search(r"short_(\d+)", f.name).group(1)] = f
          done = json.loads(Path("done.json").read_text(encoding="utf-8"))
          tt = json.loads(Path("tt_done.json").read_text(encoding="utf-8")) if Path("tt_done.json").exists() else {}
          want = [v.strip().zfill(3) for v in os.environ.get("VIDEOS", "").split(",") if v.strip()]
          if not want:
              now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              pend = sorted(k for k, v in done.items()
                            if k >= "004" and k not in tt and v.get("publish_at", "") <= now)
              want = [k for k in pend if k in found][:1]
          out = Path("output"); out.mkdir(exist_ok=True)
          for iid in want:
              if iid not in found:
                  print(f"[tt] No encontré el video {iid}"); continue
              shutil.copy(found[iid], out / found[iid].name)
              (out / "meta.json").write_text(json.dumps({"id": iid, "file": found[iid].name, "caption": ""}), encoding="utf-8")
              print(f"[tt] Subiendo {iid}", flush=True)
              subprocess.run(["python", "crosspost.py"])
          PY

      - name: Guardar
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          for f in tt_done.json tt_token.enc; do [ -f "$f" ] && git add "$f"; done
          git commit -m "TikTok" || echo "nada para guardar"
          git stash --include-untracked || true
          ok=""
          for i in 1 2 3 4; do  # si otro workflow guardó justo antes, reintenta (si no se guarda, se repetiría la subida)
            if git pull --rebase && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::No se pudo guardar el registro de lo subido"; exit 1; }
