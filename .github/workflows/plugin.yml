name: Videos con el plugin animation-studio

# Filma una película de demo/plugin/<carpeta> (dibujo estilo papel, letra del canal).
# Carpeta con storyboard.json (tanda): pone la voz de Valentín (ElevenLabs), efectos y música, y usa demo/plugin/_base.
# Carpeta sin storyboard.json: usa la voz del video hecho a mano de la misma idea (plugin.json "base"). accion "armar": queda en demo/plugin/<carpeta>/video.mp4 para revisar.
# accion "publicar": además la copia a manual/<id>.mp4 y el Short diario la sube (respeta "desde" de ideas.json).
on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Carpetas en demo/plugin separadas por espacio (ej: monje)"
        required: true
      accion:
        description: "armar o publicar"
        required: true
        default: "armar"

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg, Chrome y el motor del plugin
        run: |
          # ffmpeg ya armado desde GitHub (BtbN, autorizado por Valentín)
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          # motor del plugin animation-studio (MIT, i-afaqrashid/claude-animation-studio), fijado a la versión probada
          git clone -q https://github.com/i-afaqrashid/claude-animation-studio.git /tmp/as
          git -C /tmp/as checkout -q 84498ea4a1fd860ac96cf06a0a7b4cb7bde825d8
          curl -fsSL --retry 3 -o /tmp/Montserrat.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > /tmp/chrome.sh && chmod +x /tmp/chrome.sh
          google-chrome --version
          pip install -q -r requirements.txt

      - name: Filmar
        env:
          CHROME_PATH: /tmp/chrome.sh
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
        run: |
          for c in ${{ github.event.inputs.carpeta }}; do
            D="demo/plugin/$c"
            if [ -f "$D/storyboard.json" ]; then
              python3 demo/plugin/voz.py "$c" || { echo "falló la voz de $c"; continue; }
              cp demo/plugin/_base/index.html demo/plugin/_base/score.js demo/plugin/_base/lib.js "$D/"
            else
              python3 demo/plugin/preparar.py "$c"
            fi
            cp -r /tmp/as/skills/animation-studio/engine "$D/engine"
            cp /tmp/Montserrat.ttf "$D/assets/Montserrat.ttf"
            mkdir -p "$D/out"
            ( cd "$D" && node engine/render.js video ) || { echo "falló $c"; continue; }
            ffmpeg -v error -y -i "$D/out/video.mp4" -i "$D/assets/voz.wav" -map 0:v -map 1:a -c:v libx264 -preset medium \
              -b:v 2300k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -r 30 -c:a aac -b:a 160k -ar 48000 -shortest \
              -movflags +faststart "$D/video.mp4"
            ffmpeg -hide_banner -i "$D/video.mp4" -vf "freezedetect=n=0.002:d=0.7,blackdetect=d=0.2" -an -f null - 2>&1 \
              | grep -E "freeze_start|black_start" > "$D/qa.txt" || true
            echo "control $c:"; cat "$D/qa.txt"
            rm -rf "$D/engine" "$D/out" "$D/assets/voz.wav" "$D/assets/Montserrat.ttf"
            if [ -f "$D/storyboard.json" ]; then rm -f "$D/index.html" "$D/score.js" "$D/lib.js"; fi
            if [ "${{ github.event.inputs.accion }}" = "publicar" ]; then
              if [ -s "$D/qa.txt" ]; then echo "::warning::$c tiene tramos quietos o negros: no se publica"; continue; fi
              ID=$(python3 -c "import json;print(json.load(open('$D/plugin.json'))['id'])")
              mkdir -p manual && cp "$D/video.mp4" "manual/$ID.mp4" && echo "En cola: manual/$ID.mp4"
            fi
          done

      - name: Guardar en el repo
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add demo/plugin/ manual/ 2>/dev/null || true
          git commit -m "Plugin animation-studio: ${{ github.event.inputs.carpeta }} (${{ github.event.inputs.accion }})" || echo "nada para guardar"
          for i in 1 2 3 4; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
