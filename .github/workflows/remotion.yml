name: Videos con Remotion

# Filma un video de demo/remotion/<carpeta> (React + Remotion, letra del canal) con la voz del video hecho a mano
# de la misma idea. accion "armar": queda en demo/remotion/<carpeta>/video.mp4 para revisar.
# accion "publicar": además lo copia a manual/<id>.mp4 y el Short diario lo sube (respeta "desde" de ideas.json).
on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Carpetas en demo/remotion separadas por espacio (ej: monje)"
        required: true
      accion:
        description: "armar o publicar"
        required: true
        default: "armar"

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  remotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar ffmpeg y la letra del canal
        run: |
          # ffmpeg ya armado desde GitHub (BtbN, autorizado por Valentín)
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          curl -fsSL --retry 3 -o /tmp/Montserrat.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"

      - name: Filmar
        run: |
          for c in ${{ github.event.inputs.carpeta }}; do
            D="demo/remotion/$c"
            python3 demo/remotion/preparar.py "$c"
            cp /tmp/Montserrat.ttf "$D/public/Montserrat.ttf"
            ( cd "$D" && npm install --no-audit --no-fund && npx remotion render Video out/video.mp4 --concurrency=2 ) || { echo "falló $c"; continue; }
            ffmpeg -v error -y -i "$D/out/video.mp4" -c:v libx264 -preset medium -b:v 2300k -maxrate 3000k -bufsize 6000k \
              -pix_fmt yuv420p -r 30 -c:a aac -b:a 160k -ar 48000 -movflags +faststart "$D/video.mp4"
            ffmpeg -hide_banner -i "$D/video.mp4" -vf "freezedetect=n=0.002:d=0.7,blackdetect=d=0.2" -an -f null - 2>&1 \
              | grep -E "freeze_start|black_start" > "$D/qa.txt" || true
            echo "control $c:"; cat "$D/qa.txt"
            rm -rf "$D/node_modules" "$D/out" "$D/public" "$D/package-lock.json"
            if [ "${{ github.event.inputs.accion }}" = "publicar" ]; then
              if [ -s "$D/qa.txt" ]; then echo "::warning::$c tiene tramos quietos o negros: no se publica"; continue; fi
              ID=$(python3 -c "import json;print(json.load(open('$D/plugin.json'))['id'])")
              mkdir -p manual && cp "$D/video.mp4" "manual/$ID.mp4" && echo "En cola: manual/$ID.mp4"
            fi
          done

      - name: Guardar en el repo
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add demo/remotion/ manual/ 2>/dev/null || true
          git commit -m "Remotion: ${{ github.event.inputs.carpeta }} (${{ github.event.inputs.accion }})" || echo "nada para guardar"
          for i in 1 2 3 4; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
