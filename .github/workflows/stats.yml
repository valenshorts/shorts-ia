name: Estadísticas semanales

# Los lunes a las 08:20 AR guarda stats/semana.json con vistas, likes y retención de cada Short
# (YouTube + Instagram). La tarea "Resumen semanal El Porqué de Todo" (lunes 9:52) lee ese archivo.
# A mano: Actions → Estadísticas semanales → Run workflow.
on:
  schedule:
    - cron: "20 11 * * 1"   # lunes 08:20 AR
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml", "stats.py", "yt_token.enc"]   # corre cuando se crea o cambia (o se conecta el permiso)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer estadísticas
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          pip install -q google-api-python-client google-auth
          python stats.py

      - name: Guardar stats/semana.json
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add stats/
          git commit -m "Estadísticas de la semana" || { echo "nada para guardar"; exit 0; }
          ok=""
          for i in 1 2 3 4; do
            if git pull --rebase && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::No se pudieron guardar las estadísticas"; exit 1; }
