name: Solo Instagram

# Sube a Instagram videos que ya se hicieron (no genera nada nuevo ni toca YouTube).
on:
  workflow_dispatch:
    inputs:
      videos:
        description: "Números de idea separados por coma (ej: 004,005,006). Vacío = el último."
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar los videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          for r in $(gh run list -R "${{ github.repository }}" -w diario.yml --status success --limit 40 --json databaseId -q '.[].databaseId'); do
            gh run download "$r" -R "${{ github.repository }}" -n short -D "dl/$r" 2>/dev/null || true
          done
          find dl -name "*.mp4"

      - name: Subir a Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          VIDEOS: ${{ github.event.inputs.videos }}
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess, time
          from pathlib import Path
          found = {}
          for f in sorted(Path("dl").rglob("short_*.mp4"), key=lambda p: p.stat().st_mtime):
              found[re.search(r"short_(\d+)", f.name).group(1)] = f
          want = [v.strip().zfill(3) for v in os.environ.get("VIDEOS", "").split(",") if v.strip()]
          if not want:
              want = [max(found)] if found else []
          ideas = {i["id"]: i for i in json.load(open("ideas.json", encoding="utf-8"))}
          norm = lambda w: re.sub(r"[^\wáéíóúñü]", "", w.lower())
          out = Path("output"); out.mkdir(exist_ok=True)
          for k, iid in enumerate(want):
              if iid not in found:
                  print(f"[ig] No encontré el video {iid} (GitHub guarda los videos 14 días)"); continue
              idea = ideas[iid]
              shutil.copy(found[iid], out / found[iid].name)
              tags = " ".join("#" + norm(t) for t in idea.get("tags", []) if norm(t))
              first = re.split(r"(?<=[.!?])\s+", idea["narration"].strip())[0]
              cap = (f"{idea.get('yt_title') or idea['title']}\n\n{first}\n\n"
                     f"Síguenos para un dato nuevo cada día 🤯\n\n{tags} #curiosidades #sabiasque #datoscuriosos")
              (out / "meta.json").write_text(json.dumps({"id": iid, "file": found[iid].name, "caption": cap},
                                                         ensure_ascii=False), encoding="utf-8")
              print(f"[ig] Subiendo {iid}: {idea['title']}", flush=True)
              subprocess.run(["python", "crosspost.py"])
              if k < len(want) - 1:
                  time.sleep(60)
          PY
