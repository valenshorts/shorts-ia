name: Videos hechos a mano

# Videos de calidad "Torre Eiffel v6": cada uno tiene su carpeta en demo/manual/<nombre>/.
# accion "armar": hace demo/manual/<nombre>/video.mp4 para revisarlo (no se publica).
# accion "publicar": lo copia a manual/<id>.mp4; el Short diario lo sube en el próximo horario libre.
on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Carpetas en demo/manual separadas por espacio (ej: neptuno nube)"
        required: true
      accion:
        description: "armar, publicar o ambos"
        required: true
        default: "armar"

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  manual:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg y navegador
        if: github.event.inputs.accion != 'publicar'
        timeout-minutes: 35
        run: |
          # ffmpeg ya armado desde GitHub (BtbN, autorizado por Valentín): rápido. El mirror de Ubuntu queda de respaldo.
          if curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          else
            for i in 1 2 3; do
              sudo timeout 300 apt-get update -qq -o Acquire::Retries=3 && sudo timeout 420 apt-get install -y -qq -o Acquire::Retries=3 ffmpeg && break
              echo "reintento apt $i"; sleep 10
            done
          fi
          ffmpeg -version | head -1
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Armar el video
        if: github.event.inputs.accion != 'publicar'
        env:  # voz clonada de Valentín (ElevenLabs v4)
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
        run: |
          for c in ${{ github.event.inputs.carpeta }}; do
            python demo/manual/render.py "$c" || echo "falló $c"
          done

      - name: Pasarlo a la cola del Short diario
        if: github.event.inputs.accion != 'armar'
        run: |
          mkdir -p manual
          for c in ${{ github.event.inputs.carpeta }}; do
            C="demo/manual/$c"
            ID=$(python -c "import json;print(json.load(open('$C/storyboard.json'))['id'])")
            if [ -f "$C/video.mp4" ]; then cp "$C/video.mp4" "manual/$ID.mp4"; echo "En cola: manual/$ID.mp4"; else echo "sin video: $c"; fi
          done

      - name: Guardar en el repo
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add demo/manual/
          if [ -d manual ]; then git add manual/; fi
          git commit -m "Video hecho a mano: ${{ github.event.inputs.carpeta }} (${{ github.event.inputs.accion }})" || echo "nada para guardar"
          for i in 1 2 3 4; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
