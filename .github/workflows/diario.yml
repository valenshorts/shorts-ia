name: Short diario

on:
  schedule:
    # 18:07, 20:07 y 22:07 hora Argentina. Si la primera falla por cuota, lo reintenta solo.
    - cron: "7 21 * * *"
    - cron: "7 23 * * *"
    - cron: "7 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg y librerías
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Generar y subir el Short
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python generate.py

      - name: Guardar el video para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Subir a Instagram y TikTok
        if: hashFiles('output/meta.json') != '' && hashFiles('crosspost.py') != ''
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python crosspost.py

      - name: Marcar la idea como hecha
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add done.json ideas.json
          git commit -m "Short del día" || echo "nada para guardar"
          git pull --rebase && git push
