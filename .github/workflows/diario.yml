name: Short diario

on:
  schedule:
    # Intentos 12:07, 15:07, 18:07, 21:07 y 00:07 de Argentina: van sumando imágenes/animaciones al trabajo guardado.
    # 19:50 AR: publica el video del día directo en público (desde publish_after_ar en config.json; 21:07 queda de respaldo).
    # El video se publica recién cuando está completo (1 por día).
    - cron: "7 15 * * *"
    - cron: "7 18 * * *"
    - cron: "7 21 * * *"
    - cron: "50 22 * * *"
    - cron: "7 0 * * *"
    - cron: "7 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg y librerías
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Recuperar lo generado en intentos anteriores
        uses: actions/cache/restore@v4
        with:
          path: work
          key: work-${{ github.run_id }}
          restore-keys: work-

      - name: Generar y subir el Short
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # la corrida de las 21:07 AR es la última que puede publicar el video del día
          LAST_CHANCE: ${{ github.event.schedule == '7 0 * * *' && '1' || '' }}
        run: python generate.py

      - name: Guardar lo generado para el próximo intento
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work
          key: work-${{ github.run_id }}

      - name: Guardar el video para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Marcar la idea como hecha
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add done.json ideas.json
          git commit -m "Short del día" || echo "nada para guardar"
          git stash --include-untracked || true  # otros archivos tocados no frenan el guardado
          ok=""
          for i in 1 2 3 4; do  # si otro workflow guardó justo antes, reintenta (si no se guarda, se repetiría la subida)
            if git pull --rebase && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::No se pudo guardar el registro de lo subido"; exit 1; }
