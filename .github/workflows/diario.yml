name: Short diario

on:
  schedule:
    # Un intento cada 3 horas (a las :40 de Argentina). Cada intento suma imágenes/animaciones al trabajo guardado;
    # cuando un video está COMPLETO (5 escenas animadas, aprobadas y revisado entero) se sube a YouTube programado
    # para el próximo horario libre: 21:30 y 00:30 AR (principales) y 15:00 AR (solo si sobran videos).
    # Los intentos de las 21:40, 00:40 y 15:40 además publican el comentario de los videos que acaban de salir.
    - cron: "40 0 * * *"    # 21:40 AR
    - cron: "40 3 * * *"    # 00:40 AR
    - cron: "40 6 * * *"    # 03:40 AR
    - cron: "40 9 * * *"    # 06:40 AR
    - cron: "40 12 * * *"   # 09:40 AR
    - cron: "40 15 * * *"   # 12:40 AR
    - cron: "40 18 * * *"   # 15:40 AR
    - cron: "40 21 * * *"   # 18:40 AR (si no hay video para las 21:30, avisa en rojo por mail)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04  # fijo: "ubuntu-latest" está pasando a Ubuntu 26 (10-11/11 se colgaba instalando ffmpeg)
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg y librerías
        timeout-minutes: 25
        run: |
          ok=""
          for i in 1 2; do  # los servidores de Ubuntu a veces no responden: reintenta (máx. 5 min por intento)
            if timeout 300 sudo apt-get update -qq -o Acquire::Retries=3 && timeout 300 sudo apt-get install -y -qq -o Acquire::Retries=3 ffmpeg; then ok=1; break; fi
            echo "apt falló (intento $i)"; sleep 30
          done
          if [ -z "$ok" ]; then  # plan B: ffmpeg ya armado, bajado desde GitHub (mismos filtros que usa el video)
            echo "::warning::No se pudo instalar ffmpeg desde Ubuntu; uso el de GitHub (BtbN)"
            base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
            for f in ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz ffmpeg-master-latest-linux64-gpl.tar.xz; do
              curl -fsSL --retry 3 "$base/$f" -o /tmp/ff.tar.xz && break
            done
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            echo "/tmp/ff/bin" >> "$GITHUB_PATH"
            export PATH="/tmp/ff/bin:$PATH"
            /tmp/ff/bin/ffmpeg -version | head -1
          fi
          ffmpeg -hide_banner -filters | grep -q freezedetect  # el control anti-congelado lo necesita
          pip install -r requirements.txt

      - name: Recuperar lo generado en intentos anteriores
        uses: actions/cache/restore@v4
        with:
          path: work
          key: work-${{ github.run_id }}
          restore-keys: work-

      - name: Generar y subir el Short
        id: gen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          HF_TOKEN_3: ${{ secrets.HF_TOKEN_3 }}
          HF_TOKEN_4: ${{ secrets.HF_TOKEN_4 }}
          HF_TOKEN_5: ${{ secrets.HF_TOKEN_5 }}
          HF_TOKEN_6: ${{ secrets.HF_TOKEN_6 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python generate.py

      - name: Guardar lo generado para el próximo intento
        if: always() && steps.gen.outcome != 'skipped'  # si no llegó a generar, no pisa lo guardado
        uses: actions/cache/save@v4
        with:
          path: work
          key: work-${{ github.run_id }}

      - name: Guardar el video para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Marcar la idea como hecha
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add done.json ideas.json
          git commit -m "Short del día" || echo "nada para guardar"
          git stash --include-untracked || true  # otros archivos tocados no frenan el guardado
          ok=""
          for i in 1 2 3 4; do  # si otro workflow guardó justo antes, reintenta (si no se guarda, se repetiría la subida)
            if git pull --rebase && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::No se pudo guardar el registro de lo subido"; exit 1; }
