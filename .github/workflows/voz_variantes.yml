name: Variantes de voz (solo audio)

# Genera el audio del guion con varias configuraciones de ElevenLabs para comparar.
# No instala nada pesado: tarda 1 o 2 minutos. No toca videos ni publica.
on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Carpeta en demo/manual (ej: saturno)"
        required: true
        default: "saturno"

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  variantes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generar variantes
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
        run: python3 demo/manual/voz_variantes.py "${{ github.event.inputs.carpeta }}"

      - name: Guardar en el repo
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add demo/voz_variantes/ || true
          git commit -m "Variantes de voz: ${{ github.event.inputs.carpeta }}" || echo "nada para guardar"
          for i in 1 2 3 4; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
