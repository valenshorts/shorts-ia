<!doctype html>
<html><head><meta charset="utf-8">
<!-- Capa transparente de la prueba dopamínica: subtítulos de la tanda (letra del canal), sellos y barra de progreso -->
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const D = /*DATA*/null;
const W = 1080, H = 1920, CX = 540, YEL = '#FFD22E';
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const outC = (p) => 1 - Math.pow(1 - p, 3);
const back = (p) => { const c = 2.2; return p <= 0 ? 0 : 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const font = (s, w) => { ctx.font = `${w} ${s}px M, sans-serif`; };
function captions(t) {
  const c = D.chunks.find((x) => t >= x.t && t < x.end); if (!c) return;
  const p = outC(clamp((t - c.t) / 0.14));
  ctx.save(); font(58, 800); const sp = ctx.measureText(' ').width;
  const ws = c.w.map((w) => { const x = w.x.toUpperCase().replace(/[,;:]$/, '').replace(/\.$/, ''); return { x, t: w.t, k: w.k, ww: ctx.measureText(x).width }; });
  const lines = [[]]; let lw = 0;
  for (const w of ws) { if (lines[lines.length - 1].length && lw + sp + w.ww > 872) { lines.push([]); lw = 0; } lines[lines.length - 1].push(w); lw += (lw ? sp : 0) + w.ww; }
  const widths = lines.map((ln) => ln.reduce((s, w) => s + w.ww, 0) + sp * (ln.length - 1));
  const bw = Math.max(...widths) + 68, lh = 65, bh = lines.length * lh + 42, top = 1390 + (1 - p) * 14;
  ctx.globalAlpha = p; ctx.fillStyle = 'rgba(8,13,43,0.82)'; ctx.beginPath(); ctx.roundRect(CX - bw / 2, top, bw, bh, 26); ctx.fill();
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  lines.forEach((ln, li) => { let x = CX - widths[li] / 2; const y = top + 70 + li * lh;
    for (const w of ln) { ctx.globalAlpha = p * (t >= w.t - 0.04 ? 1 : 0.42); ctx.fillStyle = w.k ? YEL : '#FFFFFF'; ctx.fillText(w.x, x, y); x += w.ww + sp; } });
  ctx.restore();
}
function stamps(t) {
  for (const s of D.stamps) {
    const a = t - s.t; if (a < 0 || a > 1.0) continue;
    const k = back(clamp(a / 0.22)) * (a > 0.75 ? 1 - (a - 0.75) / 0.25 : 1), rot = (s.t * 7 % 2 > 1 ? 1 : -1) * 0.07;
    ctx.save(); ctx.translate(CX, 560); ctx.rotate(rot); ctx.scale(k, k);
    let size = 150; font(size, 900); while (ctx.measureText(s.x).width > 940 && size > 70) { size -= 8; font(size, 900); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = 22; ctx.strokeStyle = '#080D2B'; ctx.strokeText(s.x, 0, 0);
    ctx.shadowColor = 'rgba(255,210,46,0.7)'; ctx.shadowBlur = 40; ctx.fillStyle = YEL; ctx.fillText(s.x, 0, 0);
    ctx.restore();
  }
}
function draw(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.save(); font(28, 700); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.textAlign = 'center'; ctx.letterSpacing = '3.4px';
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 10; ctx.fillText('EL PORQUÉ DE TODO', CX, 124); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(0, 0, W, 10); ctx.fillStyle = YEL; ctx.fillRect(0, 0, W * clamp(t / D.total), 10);
  stamps(t); captions(t);
}
new FontFace('M', `url(${D.font})`, { weight: '100 900' }).load().then((f) => { document.fonts.add(f); window.READY = true; });
</script></body></html>
