<!doctype html>
<html><head><meta charset="utf-8">
<!-- Motor "cine": plantillas de escena. render(t) dibuja el cuadro del segundo t (todo con código, sin animaciones CSS). -->
<style>
@font-face{font-family:"M";src:url(FONTURL);font-weight:100 900}
:root{--navy:#080D2B;--yellow:#FFD22E;--teal:#19B8B2}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:"M","Noto Color Emoji",sans-serif;color:#fff}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bgl{position:absolute;left:-90px;top:-160px;width:1260px;height:2240px;display:none}
#stage{transform-origin:0 0}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.o{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;will-change:transform}
.o img,.o svg{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.o .em{font-family:"Noto Color Emoji";line-height:1}
.rays{position:absolute;left:0;top:0;width:1300px;height:1300px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,210,46,.16) 0deg 7deg,rgba(255,210,46,0) 7deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);opacity:0}
.glow{position:absolute;left:0;top:0;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,46,.35),rgba(255,210,46,0) 65%);opacity:0}
.ring{position:absolute;left:0;top:0;width:300px;height:300px;border-radius:50%;border:8px solid var(--yellow);opacity:0}
.ghost{opacity:0}
.tag{position:absolute;left:0;top:0;font-weight:800;font-size:34px;letter-spacing:.05em;padding:10px 24px;border-radius:40px;
  background:rgba(8,13,43,.8);border:3px solid var(--teal);white-space:nowrap;text-transform:uppercase;opacity:0}
.sym{position:absolute;left:0;top:0;font-weight:900;font-size:120px;color:var(--yellow);text-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0}
.bar{position:absolute;left:150px;top:1150px;width:780px;height:34px;border-radius:17px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#19B8B2,#FFD22E);border-radius:17px}
.lens{position:absolute;left:0;top:0;width:520px;height:520px;border-radius:50%;border:8px solid #fff;background:rgba(8,13,43,.92);
  overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0}
.lens .o img{filter:none}
svg.line{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
#head{position:absolute;left:60px;right:60px;top:170px;text-align:center}
#kick{font-weight:800;font-size:40px;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}
#h1{font-weight:900;font-size:96px;line-height:.98;letter-spacing:-.015em;text-transform:uppercase;text-shadow:0 6px 24px rgba(0,0,0,.45)}
#h1 b{color:var(--yellow);font-weight:900}
#num{position:absolute;left:0;right:0;top:340px;text-align:center;font-weight:900;color:var(--yellow);opacity:0;white-space:nowrap}
#numv{font-size:190px;letter-spacing:-.03em;text-shadow:0 8px 30px rgba(0,0,0,.5)}
#numu{font-size:80px;margin-left:12px}
#cap{position:absolute;left:70px;right:70px;top:1300px;display:flex;justify-content:center}
#capbox{background:rgba(8,13,43,.82);border-radius:26px;padding:20px 34px 22px;text-align:center;max-width:940px;
  font-weight:800;font-size:58px;line-height:1.12;text-transform:uppercase;opacity:0}
#capbox span{white-space:nowrap}
#capbox .k{color:var(--yellow)}
#brand{position:absolute;top:96px;left:0;right:0;text-align:center;font-weight:700;font-size:28px;letter-spacing:.12em;
  color:rgba(255,255,255,.55);text-transform:uppercase}
#vig{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
</style></head>
<body>
<div id="bg" class="full"></div>
<div id="stage" class="full"></div>
<svg id="dust" class="full" viewBox="0 0 1080 1920"></svg>
<div id="hud" class="full">
  <div id="brand"></div>
  <div id="head"><div id="kick"></div><div id="h1"></div></div>
  <div id="num"><span id="numv"></span><span id="numu"></span></div>
  <div id="cap"><div id="capbox"></div></div>
</div>
<div id="vig" class="full"></div>
<script>
var DATA = /*DATA*/null;
var NS = "http://www.w3.org/2000/svg", W = 1080, H = 1920;

// ---------- utilidades
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function lerp(a, b, p) { return a + (b - a) * p; }
function seg(t, a, b) { return b <= a ? (t >= b ? 1 : 0) : clamp((t - a) / (b - a), 0, 1); }
var E = {
  out: function (p) { return 1 - Math.pow(1 - p, 3); },
  inout: function (p) { return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; },
  inq: function (p) { return p * p * p; },
  spring: function (p) { var c = 1.4; return p <= 0 ? 0 : 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
};
function rnd(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function $(id) { return document.getElementById(id); }
function div(cls, parent, html) { var e = document.createElement("div"); e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e; }
function svgEl(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
// coloca un elemento centrado en (x, y)
function put(e, x, y, s, r, op) {
  e.style.transform = "translate(" + x + "px," + y + "px) translate(-50%,-50%) scale(" + s + ") rotate(" + (r || 0) + "deg)";
  e.style.opacity = op;
}

// ---------- dibujos propios (vectoriales)
var LIB = {
  torre_eiffel: function () {
    var d = "M187 0 L193 0 L193 40 L202 40 L202 70 L210 76 Q218 500 248 640 L260 640 L260 656 L252 656 Q268 740 298 815 L312 815 L312 838 L302 838 Q330 930 380 1000 L330 1000 C320 930 250 880 190 880 C130 880 60 930 50 1000 L0 1000 Q50 930 78 838 L68 838 L68 815 L82 815 Q112 740 128 656 L120 656 L120 640 L132 640 Q162 500 170 76 L178 70 L178 40 L187 40 Z";
    return '<svg viewBox="-310 0 1000 1000"><defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#9a5a1c"/><stop offset=".5" stop-color="#ffd27a"/><stop offset="1" stop-color="#a8621e"/></linearGradient>' +
      '<pattern id="tl" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 0L16 16M16 0L0 16" stroke="#3a1d06" stroke-width="1.6" opacity=".55"/></pattern></defs>' +
      '<path d="' + d + '" fill="url(#tg)"/><path d="' + d + '" fill="url(#tl)"/><path d="' + d + '" fill="none" stroke="#2a1404" stroke-width="2.2" opacity=".7"/></svg>';
  }
};
function obj(key, size, parent) {
  var w = div("o", parent);
  w.style.width = size + "px"; w.style.height = size + "px";
  if (LIB[key]) w.innerHTML = LIB[key]();
  else if (DATA.assets[key]) { var im = document.createElement("img"); im.src = DATA.assets[key]; w.appendChild(im); }
  else w.innerHTML = '<span class="em" style="font-size:' + Math.round(size * .82) + 'px">' + esc(key) + '</span>';
  return w;
}
function tagEl(txt, parent, color) { var t = div("tag", parent); t.textContent = txt; if (color) t.style.borderColor = color; return t; }

// ---------- fondos (se dibujan una vez; la cámara los mueve con parallax)
var BG = {}, R = rnd(11);
function stars(svg, n, maxY, rmax) { for (var i = 0; i < n; i++) svgEl("circle", { cx: R() * 1260, cy: R() * maxY, r: .8 + R() * rmax, fill: "#fff", opacity: .2 + R() * .6 }, svg); }
function buildBg(kind) {
  var g = { ciudad: ["#101d4f", "#2a2a6a"], espacio: ["#050826", "#171050"], cielo: ["#173a86", "#c9805a"], mar: ["#071b45", "#0e5370"],
    laboratorio: ["#0b1640", "#0f2458"], cuerpo: ["#260a2c", "#5c1238"], naturaleza: ["#122452", "#2d5b5b"], cocina: ["#24163a", "#4d2b3c"] }[kind];
  var l = div("bgl", $("bg"));
  l.style.background = "linear-gradient(180deg," + g[0] + " 0%," + g[1] + " 82%,#080D2B 100%)";
  var s = svgEl("svg", { viewBox: "0 0 1260 2240", width: 1260, height: 2240 }, l);
  if (kind === "ciudad" || kind === "espacio" || kind === "naturaleza") stars(s, kind === "espacio" ? 260 : 130, kind === "espacio" ? 2240 : 1500, kind === "espacio" ? 2.6 : 2);
  if (kind === "espacio") {
    svgEl("circle", { cx: 300, cy: 600, r: 420, fill: "#19B8B2", opacity: .07 }, s); svgEl("circle", { cx: 1000, cy: 1500, r: 520, fill: "#7a3cff", opacity: .08 }, s);
  }
  if (kind === "ciudad") {
    var x = -20;
    while (x < 1280) {
      var bw = 50 + R() * 90, bh = 100 + R() * 240;
      svgEl("rect", { x: x, y: 2040 - bh, width: bw + 1, height: bh + 200, fill: "#0b1338" }, s);
      for (var wy = 2040 - bh + 18; wy < 2030; wy += 34) for (var wx = x + 12; wx < x + bw - 14; wx += 26)
        if (R() < .3) svgEl("rect", { x: wx, y: wy, width: 10, height: 14, fill: "#ffd22e", opacity: .5 }, s);
      x += bw + 4;
    }
  }
  if (kind === "cielo") {
    svgEl("circle", { cx: 980, cy: 1650, r: 260, fill: "#ffd22e", opacity: .25 }, s);
    for (var c = 0; c < 9; c++) { var cx = R() * 1260, cy = 300 + R() * 1300; svgEl("ellipse", { cx: cx, cy: cy, rx: 120 + R() * 140, ry: 30 + R() * 30, fill: "#fff", opacity: .08 + R() * .08 }, s); }
  }
  if (kind === "mar") for (var k = 0; k < 4; k++) {
    var y = 1700 + k * 110, d = "M-200 " + y;
    for (var xx = -200; xx <= 1500; xx += 120) d += " q60 -36 120 0";
    svgEl("path", { d: d + " L1500 2240 L-200 2240 Z", fill: "#19B8B2", opacity: .08 + k * .05, "class": "wave", "data-k": k }, s);
  }
  if (kind === "laboratorio" || kind === "cocina") {
    var st = kind === "cocina" ? 90 : 60, col = kind === "cocina" ? "#ffffff" : "#19B8B2";
    for (var gx = 0; gx <= 1260; gx += st) svgEl("line", { x1: gx, x2: gx, y1: 0, y2: 2240, stroke: col, opacity: .07 }, s);
    for (var gy = 0; gy <= 2240; gy += st) svgEl("line", { x1: 0, x2: 1260, y1: gy, y2: gy, stroke: col, opacity: .07 }, s);
    if (kind === "cocina") svgEl("rect", { x: 0, y: 1960, width: 1260, height: 280, fill: "#1a0f22", opacity: .9 }, s);
  }
  if (kind === "cuerpo") for (var q = 0; q < 22; q++) svgEl("circle", { cx: R() * 1260, cy: R() * 2240, r: 30 + R() * 90, fill: "#ff5a7a", opacity: .05 + R() * .06, "class": "cell" }, s);
  if (kind === "naturaleza") {
    [["#0f2d3a", 1750], ["#0c2530", 1880], ["#081a24", 2000]].forEach(function (h) {
      var d = "M0 " + h[1]; for (var xx = 0; xx <= 1260; xx += 210) d += " Q" + (xx + 105) + " " + (h[1] - 80 - R() * 90) + " " + (xx + 210) + " " + h[1];
      svgEl("path", { d: d + " L1260 2240 L0 2240 Z", fill: h[0] }, s);
    });
  }
  BG[kind] = l;
}

// ---------- construcción de cada escena (una vez)
var S = [];
function build() {
  $("brand").textContent = DATA.brand || "";
  var dust = $("dust"), r = rnd(5);
  DUST = [];
  for (var i = 0; i < 34; i++) DUST.push({ x: r() * W, y: r() * H, v: 14 + r() * 30, s: 1.5 + r() * 3, ph: r() * 6.3, e: svgEl("circle", { r: 2, fill: "#fff" }, dust) });
  DATA.scenes.forEach(function (d, k) {
    if (!BG[d.fondo]) buildBg(d.fondo);
    var c = div("sc", $("stage")), o = { d: d, c: c };
    o.glow = div("glow", c); o.rays = div("rays", c); o.ring = div("ring", c);
    var p = d.plantilla;
    if (p === "gancho" || p === "cierre") {
      o.ghost = obj(d.e, 560, c); o.ghost.className += " ghost"; o.ghost.style.filter = "grayscale(1) brightness(1.6)";
      o.hero = obj(d.e, 560, c);
      if (d.etiqueta) o.t1 = tagEl(d.etiqueta, c, "#FFD22E");
    } else if (p === "numero") {
      o.hero = obj(d.e, 330, c); o.bar = div("bar", c, "<i></i>");
      if (d.etiqueta) o.t1 = tagEl(d.etiqueta, c);
    } else if (p === "comparar") {
      o.hero = obj(d.e, 360, c); o.h2 = obj(d.e2, 360, c); o.sym = div("sym", c); o.sym.textContent = "VS";
      o.t1 = tagEl(d.etiqueta || "", c, "#19B8B2"); o.t2 = tagEl(d.etiqueta2 || "", c, "#FFD22E");
    } else if (p === "proceso") {
      o.hero = obj(d.e, 440, c); o.h2 = obj(d.e2, 380, c);
      o.line = svgEl("svg", { "class": "line", viewBox: "0 0 1080 1920" }, c);
      o.arrow = svgEl("path", { d: "M400 900 L660 900", stroke: "#FFD22E", "stroke-width": 16, "stroke-linecap": "round", fill: "none", "stroke-dasharray": 260, "stroke-dashoffset": 260 }, o.line);
      o.head = svgEl("path", { d: "M640 870 L690 900 L640 930", stroke: "#FFD22E", "stroke-width": 16, "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none", opacity: 0 }, o.line);
      if (d.etiqueta) o.t1 = tagEl(d.etiqueta, c, "#19B8B2");
      if (d.etiqueta2) o.t2 = tagEl(d.etiqueta2, c, "#FFD22E");
    } else if (p === "zoom") {
      o.hero = obj(d.e, 520, c); o.lens = div("lens", c); o.atoms = [];
      for (var ar = -2; ar <= 2; ar++) for (var ac = -2; ac <= 2; ac++) o.atoms.push({ r: ar, c: ac, ph: r() * 6.3, ph2: r() * 6.3, e: obj(d.interior, 82, o.lens) });
      if (d.etiqueta) o.t1 = tagEl(d.etiqueta, c, "#19B8B2");
    } else if (p === "acumular") {
      o.items = [];
      for (var q = 0; q < 12; q++) o.items.push(obj(d.e, 170, c));
      if (d.etiqueta) o.t1 = tagEl(d.etiqueta, c, "#FFD22E");
    } else if (p === "linea") {
      o.line = svgEl("svg", { "class": "line", viewBox: "0 0 1080 1920" }, c);
      o.base = svgEl("path", { d: "M140 980 L940 980", stroke: "#ffffff", "stroke-width": 8, "stroke-linecap": "round", opacity: .8, "stroke-dasharray": 800, "stroke-dashoffset": 800 }, o.line);
      o.dot = svgEl("circle", { cx: 140, cy: 980, r: 22, fill: "#FFD22E", opacity: 0 }, o.line);
      o.pts = d.puntos.map(function (pt) { return { o: obj(pt.e, 190, c), t: tagEl(pt.texto, c, "#19B8B2") }; });
    }
    S.push(o);
  });
}
var DUST = [];

// ---------- texto
var lastCap = -1, lastHead = "";
function setHead(k, h, op, dy) {
  var key = k + "|" + h;
  if (key !== lastHead) { $("kick").textContent = k; $("h1").innerHTML = h; lastHead = key; }
  $("head").style.opacity = op; $("head").style.transform = "translateY(" + (dy || 0) + "px)";
}
function captions(t) {
  var C = DATA.chunks, idx = -1;
  for (var i = 0; i < C.length; i++) if (t >= C[i].a && t < C[i].b) idx = i;
  var box = $("capbox");
  if (idx < 0) { box.style.opacity = 0; return; }
  var c = C[idx];
  if (idx !== lastCap) {
    box.innerHTML = c.w.map(function (w) { return "<span" + (w.k ? ' class="k"' : "") + ">" + esc(w.x) + "</span>"; }).join(" ");
    lastCap = idx;
  }
  var sp = box.children;
  for (var j = 0; j < sp.length; j++) sp[j].style.opacity = t >= c.w[j].t - 0.04 ? 1 : .42;
  var p = E.out(seg(t, c.a, c.a + .14));
  box.style.opacity = p; box.style.transform = "translateY(" + (1 - p) * 14 + "px)";
}
function fmt(v, dec) { return v.toLocaleString("es-ES", { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: v >= 10000 }); }

// ---------- cuadro
var cur = -1;
function render(t) {
  var k = 0; for (var i = 0; i < S.length; i++) if (t >= S[i].d.a) k = i;
  var o = S[k], d = o.d, a = d.a, b = d.b, c = d.cue, ce = Math.max(d.cueEnd, c + .15), p = d.plantilla;
  if (k !== cur) {
    S.forEach(function (x, j) { x.c.style.display = j === k ? "block" : "none"; });
    for (var f in BG) BG[f].style.display = f === d.fondo ? "block" : "none";
    cur = k;
  }
  var L = b - a, enter = E.out(seg(t, a, a + .35)), drift = seg(t, a, b);
  // cámara: entra con un pequeño reencuadre (escala) y sigue con un empuje lento; cada plantilla ajusta el foco
  var cam = { s: lerp(1.07, 1, enter) + .06 * drift, fx: 540, fy: 960 };
  var head = { op: 0, dy: 0 }, num = null;
  var hit = E.out(seg(t, c, c + .45)), hitIn = seg(t, c - .05, c + .5);

  // capas de luz detrás del objeto principal
  function lights(x, y, on) {
    put(o.glow, x, y, 1 + .06 * Math.sin(t * 2.4), 0, on * .9);
    put(o.rays, x, y, 1, t * 9, on * .8);
    put(o.ring, x, y, lerp(.4, 3.2, E.out(hitIn)), 0, hitIn > 0 && hitIn < 1 ? (1 - hitIn) * .8 : 0);
  }
  if (p === "gancho" || p === "cierre") {
    var x = 540, y = 860, base = E.spring(seg(t, a, a + .5)), s = base, rot = 0, gOp = 0;
    if (d.cambio === "crece") { s *= lerp(1, 1.28, E.spring(seg(t, c, c + .6))); gOp = seg(t, c, c + .2) * .35; }
    else if (d.cambio === "achica") { s *= lerp(1, .68, E.inout(seg(t, c, c + .6))); gOp = seg(t, c, c + .2) * .35; }
    else if (d.cambio === "gira") rot = 360 * E.inout(seg(t, c, c + .9));
    else if (d.cambio === "late") s *= 1 + .08 * Math.max(0, Math.sin((t - a) * 7.5)) * seg(t, c - .2, c);
    else s *= 1 + .1 * Math.sin(Math.PI * seg(t, c, c + .5));
    var bob = Math.sin(t * 2.2) * 10;
    put(o.hero, x, y + bob, s, rot, base > 0 ? 1 : 0);
    put(o.ghost, x, y, base, 0, gOp);
    lights(x, y, enter * (d.cambio === "brilla" ? lerp(.6, 1.3, hit) : 1));
    if (o.t1) put(o.t1, 540, 1170, lerp(.8, 1, E.out(seg(t, c, c + .3))), 0, E.out(seg(t, c, c + .3)));
    head = { op: E.out(seg(t, a, a + .3)), dy: (1 - E.out(seg(t, a, a + .3))) * 24 };
    if (k === 0) head = { op: 1, dy: 0 };   // el primer cuadro ya se entiende solo
    cam.fy = 930 - 30 * drift;
  } else if (p === "numero") {
    var m = seg(t, a + .2, ce), dec = d.valor % 1 ? 1 : 0, v = d.valor * m;
    num = { v: fmt(v, dec), u: d.unidad, op: E.out(seg(t, a + .1, a + .4)), pop: Math.sin(Math.PI * seg(t, ce, ce + .3)) };
    put(o.hero, 540, 900 + Math.sin(t * 2) * 8, E.spring(seg(t, a + .05, a + .5)) * (1 + .1 * Math.sin(Math.PI * seg(t, ce, ce + .35))), 0, 1);
    lights(540, 900, enter * .7);
    o.bar.style.opacity = E.out(seg(t, a + .1, a + .4)); o.bar.firstChild.style.width = (100 * m) + "%";
    if (o.t1) put(o.t1, 540, 1240, 1, 0, E.out(seg(t, ce, ce + .3)));
    head = { op: E.out(seg(t, a, a + .3)), dy: 0 };
  } else if (p === "comparar") {
    var e1 = E.spring(seg(t, a + .05, a + .5)), e2 = E.spring(seg(t, a + .35, a + .8));
    var s2 = d.tam2 || 1;
    put(o.hero, 290, 900 + Math.sin(t * 2) * 8, e1, 0, e1 > 0 ? 1 : 0);
    put(o.h2, 790, 900 + Math.sin(t * 2 + 1.5) * 8, e2 * s2, 0, e2 > 0 ? 1 : 0);
    put(o.sym, 540, 900, lerp(.3, 1, E.spring(seg(t, c, c + .45))), 0, E.out(seg(t, c, c + .2)));
    put(o.t1, 290, 1150, 1, 0, E.out(seg(t, a + .3, a + .6)) * (d.etiqueta ? 1 : 0));
    put(o.t2, 790, 1150, 1, 0, E.out(seg(t, a + .6, a + .9)) * (d.etiqueta2 ? 1 : 0));
    lights(540, 900, 0); put(o.ring, 540, 900, lerp(.4, 3.2, E.out(hitIn)), 0, hitIn > 0 && hitIn < 1 ? (1 - hitIn) * .8 : 0);
    head = { op: E.out(seg(t, c - .1, c + .25)), dy: (1 - E.out(seg(t, c - .1, c + .25))) * 24 };
    cam.fx = lerp(510, 570, E.inout(drift));
  } else if (p === "proceso") {
    var mv = E.inout(seg(t, c - .35, c + .2));
    var ax = lerp(540, 270, mv), as = lerp(1, .72, mv) * E.spring(seg(t, a, a + .45));
    put(o.hero, ax, 900 + Math.sin(t * 2) * 8, as, 0, 1);
    var ar = seg(t, c - .1, c + .25);
    o.arrow.setAttribute("stroke-dashoffset", 260 * (1 - ar)); o.head.setAttribute("opacity", seg(ar, .8, 1));
    put(o.h2, 810, 900 + Math.sin(t * 2 + 1) * 8, E.spring(seg(t, c + .15, c + .6)), 0, seg(t, c + .1, c + .2));
    lights(810, 900, E.out(seg(t, c + .15, c + .5)) * .8);
    if (o.t1) put(o.t1, 270, 1150, 1, 0, E.out(seg(t, c - .2, c + .1)));
    if (o.t2) put(o.t2, 810, 1150, 1, 0, E.out(seg(t, c + .3, c + .6)));
    head = { op: E.out(seg(t, a + .05, a + .35)), dy: 0 };
    cam.fx = lerp(520, 580, E.inout(drift));
  } else if (p === "zoom") {
    put(o.hero, 380, 740 + Math.sin(t * 2) * 6, E.spring(seg(t, a, a + .45)) * .85, 0, 1);
    var lo = E.spring(seg(t, a + .35, a + .8));
    put(o.lens, 650, 970, lo * .88, 0, lo > 0 ? 1 : 0);
    var heat = d.agitar ? E.inout(seg(t, a + .5, ce)) : .25, sp = 96 * (1 + .18 * heat), amp = 2 + 12 * heat;
    o.atoms.forEach(function (q) {
      put(q.e, 260 + q.c * sp + Math.sin(t * 21 + q.ph) * amp, 260 + q.r * sp + Math.cos(t * 17 + q.ph2) * amp, 1, 0, 1);
    });
    lights(380, 740, enter * .5);
    if (o.t1) put(o.t1, 650, 1232, 1, 0, E.out(seg(t, a + .7, a + 1)));
    head = { op: E.out(seg(t, c - .1, c + .25)), dy: (1 - E.out(seg(t, c - .1, c + .25))) * 24 };
    cam.s += .08 * E.inout(seg(t, a + .4, b)); cam.fx = lerp(520, 600, E.inout(drift)); cam.fy = 940;
  } else if (p === "acumular") {
    var n = o.items.length;
    o.items.forEach(function (it, j) {
      var tj = lerp(a + .2, ce, j / n), e = E.spring(seg(t, tj, tj + .35));
      var col = j % 4, row = Math.floor(j / 4);
      put(it, 255 + col * 190, 640 + row * 185 + Math.sin(t * 2.5 + j) * 6, e * .88, 0, e > 0 ? 1 : 0);
    });
    num = d.valor ? { v: String(d.valor), u: d.unidad, op: E.out(seg(t, ce, ce + .3)), pop: Math.sin(Math.PI * seg(t, ce, ce + .3)) } : null;
    if (o.t1) put(o.t1, 540, 1190, 1, 0, E.out(seg(t, ce + .1, ce + .4)));
    lights(540, 850, 0); put(o.ring, 540, 850, lerp(.4, 3.4, E.out(seg(t, ce, ce + .5))), 0, seg(t, ce, ce + .5) > 0 && seg(t, ce, ce + .5) < 1 ? (1 - seg(t, ce, ce + .5)) * .8 : 0);
    head = { op: E.out(seg(t, a, a + .3)), dy: 0 };
  } else if (p === "linea") {
    var dr = E.inout(seg(t, a, a + .6));
    o.base.setAttribute("stroke-dashoffset", 800 * (1 - dr));
    var np = o.pts.length, mvp = E.inout(seg(t, a + .5, ce));
    o.dot.setAttribute("cx", lerp(140, 940, mvp)); o.dot.setAttribute("opacity", seg(t, a + .4, a + .6));
    o.pts.forEach(function (pt, j) {
      var px = lerp(180, 900, np > 1 ? j / (np - 1) : .5), tj = lerp(a + .5, ce, np > 1 ? j / (np - 1) : 0), e = E.spring(seg(t, tj, tj + .4));
      put(pt.o, px, 830 + Math.sin(t * 2 + j) * 6, e, 0, e > 0 ? 1 : 0);
      put(pt.t, px, 1060, 1, 0, E.out(seg(t, tj + .1, tj + .4)) * (pt.t.textContent ? 1 : 0));
    });
    lights(540, 900, 0);
    head = { op: E.out(seg(t, a + .05, a + .35)), dy: 0 };
    cam.fx = lerp(470, 610, E.inout(drift)); cam.s += .04;
  }

  // fondo con parallax y cosas que siempre se mueven (polvo de luz, olas, células)
  var tx = W / 2 - cam.fx * cam.s, ty = H / 2 - cam.fy * cam.s;
  $("stage").style.transform = "translate(" + tx + "px," + ty + "px) scale(" + cam.s + ")";
  var bgS = 1 + (cam.s - 1) * .3;
  BG[d.fondo].style.transform = "translate(" + ((540 - cam.fx) * .25) + "px," + ((960 - cam.fy) * .25 - 20 * drift) + "px) scale(" + bgS + ")";
  if (d.fondo === "mar") BG.mar.querySelectorAll(".wave").forEach(function (w, j) { w.setAttribute("transform", "translate(" + (Math.sin(t * .9 + j) * 60 - 60) + ",0)"); });
  if (d.fondo === "cuerpo") BG.cuerpo.querySelectorAll(".cell").forEach(function (w, j) { w.setAttribute("opacity", .05 + .04 * (1 + Math.sin(t * 1.8 + j))); });
  DUST.forEach(function (q) {
    var y = ((q.y - t * q.v) % H + H) % H, x = q.x + Math.sin(t * .8 + q.ph) * 14;
    q.e.setAttribute("cx", x); q.e.setAttribute("cy", y); q.e.setAttribute("r", q.s); q.e.setAttribute("opacity", .12 + .1 * Math.sin(t * 1.5 + q.ph));
  });

  // textos: titular, número y subtítulos
  var h1 = (p === "numero" || (p === "acumular" && d.valor)) ? "" : d.titulo;
  setHead(d.kicker || "", h1, head.op, head.dy);
  if (num) {
    $("num").style.opacity = num.op; $("num").style.top = (num.top || 340) + "px";
    if ($("numv").textContent !== num.v) $("numv").textContent = num.v;
    if ($("numu").textContent !== (num.u || "")) $("numu").textContent = num.u || "";
    $("num").style.transform = "scale(" + (1 + .12 * (num.pop || 0)) + ")";
  } else $("num").style.opacity = 0;
  captions(t);
}
build();
window.READY = true;
</script>
