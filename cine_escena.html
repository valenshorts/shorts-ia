<!doctype html>
<html><head><meta charset="utf-8">
<!-- Motor "cine": cada frase es una escena de la biblioteca (objeto, medida, comparacion, cambio, lupa, dato, lista).
     render(t) dibuja el cuadro del segundo t. Todo se arma una vez; por cuadro solo se mueven cosas. -->
<style>
@font-face{font-family:"M";src:url(FONTURL);font-weight:100 900}
@font-face{font-family:"EMO";src:url(EMOJIURL)}
:root{--navy:#080D2B;--navy2:#172B65;--yellow:#FFD22E;--teal:#19B8B2}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:"M","EMO",sans-serif;color:#fff}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
.scene{opacity:0;transform-origin:540px 900px}
.emo{font-family:"EMO";line-height:1;position:absolute;text-align:center;white-space:nowrap}
.kicker{font-weight:800;font-size:40px;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}
.h1{font-weight:900;font-size:92px;line-height:.98;letter-spacing:-.015em;text-transform:uppercase;text-shadow:0 6px 24px rgba(0,0,0,.45)}
.h1 b{color:var(--yellow);font-weight:900}
#head{position:absolute;left:60px;right:60px;top:170px;text-align:center}
.num{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:var(--yellow);white-space:nowrap}
.num .u{font-size:.42em;margin-left:.12em}
.tag{position:absolute;font-weight:800;font-size:34px;letter-spacing:.05em;padding:10px 24px;border-radius:40px;
  background:rgba(8,13,43,.8);border:3px solid var(--teal);white-space:nowrap;text-transform:uppercase;transform:translateX(-50%)}
.row{position:absolute;left:110px;right:80px;display:flex;align-items:center;gap:36px;font-weight:800;font-size:62px;line-height:1.05;text-transform:uppercase}
.row .ic{font-family:"EMO";font-size:150px;line-height:1;width:170px;flex:none;text-align:center;display:inline-block}
.vs{position:absolute;font-weight:900;font-size:110px;color:var(--yellow);transform:translate(-50%,-50%)}
#cap{position:absolute;left:70px;right:70px;top:1300px;display:flex;justify-content:center}
#capbox{background:rgba(8,13,43,.82);border-radius:26px;padding:20px 34px 22px;text-align:center;max-width:940px;
  font-weight:800;font-size:58px;line-height:1.12;text-transform:uppercase;opacity:0}
#capbox span{white-space:nowrap}
#capbox .k{color:var(--yellow)}
#brand{position:absolute;top:96px;left:0;right:0;text-align:center;font-weight:700;font-size:28px;letter-spacing:.12em;color:rgba(255,255,255,.55);text-transform:uppercase}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
</style></head>
<body>
<div id="scenes"></div>
<div id="hud" class="full">
  <div id="brand">El Porqué de Todo</div>
  <div id="head"><div class="kicker" id="kick"></div><div class="h1" id="h1"></div></div>
  <div id="cap"><div id="capbox"></div></div>
</div>
<div id="vig"></div>
<script>
var DATA = /*DATA*/null;

// ---------- biblioteca de dibujos (vector). Lo que no está acá se dibuja con el emoji.
var LIB = {
  torre_eiffel: function (s) {

  var s = sv("svg", { viewBox: "0 0 1080 1920", width: 1080, height: 1920, "class": "full" }, parent);
  var stars = kind === "laboratorio" || kind === "cuerpo" ? 0 : kind === "espacio" ? 220 : 120;
  for (var i = 0; i < stars; i++) sv("circle", { cx: r() * W, cy: r() * 1450, r: .8 + r() * 2.2, fill: "#fff", opacity: .2 + r() * .6 }, s);

    for (var gx = 0; gx <= W; gx += 60) sv("line", { x1: gx, x2: gx, y1: 0, y2: H, stroke: "#19B8B2", opacity: .09 }, s);
    for (var gy = 0; gy <= H; gy += 60) sv("line", { x1: 0, x2: W, y1: gy, y2: gy, stroke: "#19B8B2", opacity: .09 }, s);
  }
  if (kind === "cuerpo") for (var k = 0; k < 26; k++) sv("circle", { cx: r() * W, cy: r() * H, r: 30 + r() * 70, fill: "#ff6b8a", opacity: .06 + r() * .08 }, s);
  if (kind === "espacio") { sv("circle", { cx: 980, cy: 1500, r: 260, fill: "#24357e", opacity: .55 }, s); sv("circle", { cx: 80, cy: 300, r: 60, fill: "#5a3a8e", opacity: .4 }, s); }
  var ground = 1780;
  if (kind === "ciudad" || kind === "noche") {
    var x = -40;
    while (x < W + 40) {
      var bw = 50 + r() * 90, bh = 90 + r() * (kind === "ciudad" ? 260 : 120);
      sv("rect", { x: x, y: ground - bh, width: bw + 1, height: bh, fill: "#0b1338" }, s);
      if (kind === "ciudad") for (var wy = ground - bh + 18; wy < ground - 20; wy += 34) for (var wx = x + 12; wx < x + bw - 14; wx += 26)
        if (r() < .3) sv("rect", { x: wx, y: wy, width: 10, height: 14, fill: "#ffd22e", opacity: .5 }, s);
      x += bw + 4;
    }
  }
  if (kind === "naturaleza") {
    sv("path", { d: "M0 1560Q270 1430 540 1540T1080 1500V1920H0Z", fill: "#123a4a" }, s);
    sv("path", { d: "M0 1660Q300 1570 600 1650T1080 1620V1920H0Z", fill: "#0d2a3a" }, s);
  }

    for (var wv = 0; wv < 4; wv++) sv("path", { "class": "wave", d: "M-100 " + (1540 + wv * 70) + "Q170 " + (1500 + wv * 70) + " 440 " + (1540 + wv * 70) + "T980 " + (1540 + wv * 70) + "T1520 " + (1540 + wv * 70) + "V1920H-100Z", fill: "#0f4a7a", opacity: .35 + wv * .15 }, s);

// ---------- escenas de la biblioteca: build(sc, root) arma; tick(sc, t, p) mueve (t: segundos desde el inicio de la escena)
var CY = 1150;  // línea de piso de los objetos (deja arriba el título y abajo los subtítulos)
var B = {};
B.objeto = {
  build: function (sc, root) {

    sc.o = obj(sp.obj, 500, root, 540, CY);
    sc.tags = (sp.etiquetas || []).slice(0, 2).map(function (t, i) { var e = dv("tag", root, esc(t)); e.style.left = (i ? 760 : 320) + "px"; e.style.top = (i ? 700 : 620) + "px"; e.style.borderColor = i ? "#19B8B2" : "#FFD22E"; return e; });
  },
  tick: function (sc, t) {

    pose(sc.o, s, rot, dx, dy, 1);
    sc.glow.style.transform = "scale(" + (1 + .08 * Math.sin(t * 2) + .2 * acc * (1 - seg(t, k + .4, k + 1.2))) + ")";
    sc.tags.forEach(function (e, i) { var p = E.out(seg(t, k + .2 + i * .35, k + .5 + i * .35)); e.style.opacity = p; e.style.transform = "translateX(-50%) translateY(" + (1 - p) * 20 + "px)"; });

B.medida = {
  build: function (sc, root) {

    sc.ticks = [];
    for (var j = 0; j <= 20; j++) sc.ticks.push(sv("line", { x1: 680, x2: j % 5 ? 708 : 732, y1: 0, y2: 0, stroke: "#080D2B", "stroke-width": j % 5 ? 2 : 3.5 }, sc.tape));

  },

  },
  tick: function (sc, t) {

B.cambio = {
  build: function (sc, root) {

      pose(sc.oa, E.spring(seg(t, 0, .5)) * (1 - .5 * sw), -20 * sw, -40 * sw, 0, 1 - sw);

B.lupa = {
  build: function (sc, root) {

// ---------- armado
var SC = [];
function build() {
  var host = $("scenes");
  DATA.scenes.forEach(function (sc, i) {
    sc.i = i;
    var root = dv("full scene", host);
    var r = rnd(97 + i * 13);

    sc.root = root; SC.push(sc);
  });
}

// ---------- texto
var lastCap = -1, lastHead = -1;
function captions(t) {
  var C = DATA.chunks, idx = -1;
  for (var i = 0; i < C.length; i++) if (t >= C[i].a && t < C[i].b) idx = i;
  var box = $("capbox");

  if (idx !== lastCap) { box.innerHTML = c.w.map(function (w) { return "<span" + (w.k ? " class=\"k\"" : "") + ">" + esc(w.x) + "</span>"; }).join(" "); lastCap = idx; }

  for (var j = 0; j < sp.length; j++) sp[j].style.opacity = t >= c.w[j].t - 0.04 ? 1 : .42;

}

function render(t) {

    if (i !== cur) { sc.root.style.opacity = 0; return; }
